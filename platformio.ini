; ESP32 Seismograph -> Netum NT-1809 thermal printer
;
; Two environments:
;   seismo  - the real firmware (default)
;   probe   - throwaway Bluetooth discovery build, run this FIRST to find
;             the printer's address and whether it answers as Classic or BLE.
;
;   pio run -e probe  -t upload -t monitor
;   pio run -e seismo -t upload -t monitor

[platformio]
default_envs = seismo

[env]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; BT Classic + WiFi + app blow past the default 1.2MB app partition.
board_build.partitions = huge_app.csv
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1

[env:seismo]
build_src_filter = +<*> -<../tools/>
lib_deps =
    kosme/arduinoFFT@^2.0.1
    h2zero/NimBLE-Arduino@^1.4.1

[env:probe]
; Discovery firmware only. Scans Bluetooth Classic and BLE, dumps to serial.
build_src_filter = -<*> +<../tools/bt_probe/>
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
